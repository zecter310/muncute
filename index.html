<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Run: Iu Mun Cute Pink Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Thiết lập nền chung */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #FCE4EC;
            font-family: 'Mali', cursive;
            user-select: none; /* Tránh bôi đen text khi click liên tục */
        }

        /* Khung cảnh chính */
        #scene {
            width: 800px;
            height: 350px;
            position: relative;
            overflow: hidden;
            background-color: #F8BBD0; 
            border-bottom: 8px solid #C2185B; 
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(194, 24, 91, 0.2);
            cursor: pointer; /* Hiển thị con trỏ tay để báo hiệu có thể click để nhảy */
        }

        /* Điểm số (Góc trái) */
        #-board {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
            color: #C2185B;
            font-weight: bold;
            z-index: 10;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 2px 2px 0px #EC407A;
        }

        /* === 1. Hiệu ứng Mèo === */
        #cat {
            position: absolute;
            bottom: 5px;
            left: 50px;
            z-index: 2;
        }

        #cat img {
            width: 80px; /* Chỉnh nhỏ lại một chút để dễ né chướng ngại vật */
            height: auto;
            display: block;
        }

        /* Hiệu ứng chạy mặc định */
        .running {
            animation: run 0.2s infinite alternate ease-in-out;
        }

        @keyframes run {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-12px) rotate(-3deg); }
        }

        /* Hiệu ứng nhảy (Ghi đè hiệu ứng chạy) */
        .jumping {
            animation: jump 0.6s linear !important; 
        }

        @keyframes jump {
            0% { bottom: 5px; }
            40% { bottom: 150px; } /* Đỉnh cú nhảy */
            50% { bottom: 150px; } /* Lơ lửng xíu */
            60% { bottom: 150px; }
            100% { bottom: 5px; }
        }

        /* === 2. Chướng ngại vật === */
        .obstacle {
            position: absolute;
            bottom: 5px;
            right: -50px; /* Bắt đầu ngoài rìa phải */
            font-size: 40px; /* Kích thước icon cute */
            z-index: 2;
            /* Animation được cấu hình bằng JS để đổi tốc độ */
        }

        @keyframes moveObstacle {
            0% { right: -50px; }
            100% { right: 850px; } /* Chạy ra khỏi màn hình bên trái */
        }

        /* === 3. Các màn hình Overlay (Thua / Thắng) === */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(252, 228, 236, 0.9);
            display: none; /* Ẩn mặc định */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
        }

        .overlay h2 {
            font-size: 40px;
            color: #C2185B;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0px #FFF;
        }

        .overlay img {
            width: 150px;
            max-height: 150px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .btn {
            padding: 10px 30px;
            font-size: 20px;
            font-family: 'Mali', cursive;
            font-weight: bold;
            color: white;
            background-color: #EC407A;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 0px #C2185B;
            transition: all 0.1s;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 0px 0px #C2185B;
        }

        /* === Hiệu ứng Mây và Chữ bay giữ nguyên === */
        #flying-text {
            position: absolute; top: 50%; transform: translateY(-50%); left: 100%;
            font-size: 45px; font-weight: bold; color: #FFFFFF;
            text-shadow: 3px 3px 0px #EC407A, -2px -2px 5px rgba(255,255,255,0.5);
            white-space: nowrap; animation: fly 5s infinite linear; z-index: 3;
        }
        @keyframes fly { 0% { left: 110%; } 100% { left: -60%; } }
        
        .cloud { position: absolute; color: rgba(255, 255, 255, 0.7); animation: cloud-move infinite linear; z-index: 1; }
        .cloud1 { top: 40px; left: 100%; animation-duration: 12s; font-size: 40px; }
        .cloud2 { top: 100px; left: 100%; animation-duration: 9s; animation-delay: 3s; font-size: 30px; }
        .cloud3 { top: 20px; left: 100%; animation-duration: 15s; animation-delay: 1s; font-size: 25px; opacity: 0.6; }
        .cloud4 { top: 150px; left: 100%; animation-duration: 10s; animation-delay: 5s; font-size: 35px; }
        .cloud5 { top: 80px; left: 100%; animation-duration: 18s; animation-delay: 7s; font-size: 20px; opacity: 0.5; }
        @keyframes cloud-move { 0% { left: 100%; opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { left: -20%; opacity: 0; } }

        /* Pháo hoa chúc mừng (ẩn mặc định) */
        .confetti {
            position: absolute; width: 10px; height: 10px; background-color: #f00; z-index: 15;
            animation: confetti-fall 3s linear infinite;
        }
        @keyframes confetti-fall { 0% { top: -10px; transform: rotate(0deg); } 100% { top: 400px; transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="scene">
        <div id="-board">Điểm: <span id="">0</span></div>

        <div class="cloud cloud1">☁️</div>
        <div class="cloud cloud2">☁️</div>
        <div class="cloud cloud3">☁️</div>
        <div class="cloud cloud4">☁️</div>
        <div class="cloud cloud5">☁️</div>
        <div id="flying-text">Iu mun cute ❤️</div>
        
        <div id="cat" class="running">
            <img src="meo." alt="Cute Cat Icon">
        </div>

        <div id="game-over" class="overlay">
            <h2>Ui da! Đụng trúng rồi!</h2>
            <img src="meo.png" alt="Mèo khóc" onerror="this.src='https://via.placeholder.com/150/F8BBD0/C2185B?text=Meo+Khoc'">
            <button class="btn" onclick="startGame()">Chơi Lại Nè</button>
        </div>

        <div id="victory" class="overlay">
            <h2>🎉 Yayyy! Mun Giỏi Quá! 🎉</h2>
            <p style="color: #C2185B; font-weight: bold; font-size: 20px;">Đã đạt 305 điểm yêu thương ❤️</p>
            <img src="meo.png" alt="Mèo vui vẻ" onerror="this.src='https://via.placeholder.com/150/F8BBD0/C2185B?text=Meo+Vui'">
            <button class="btn" onclick="startGame()">Chơi Lại Từ Đầu</button>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cat = document.getElementById('cat');
        const Element = document.getElementById('');
        const gameOverScreen = document.getElementById('game-over');
        const victoryScreen = document.getElementById('victory');
        
        let isJumping = false;
        let isGameOver = false;
        let isGameWon = false;
        let  = 0;
        let gameSpeed = 2.5; // Tốc độ ban đầu của chướng ngại vật (giây)
        let obstacleInterval;
        let gameLoop;
        
        // Mảng các icon cute làm chướng ngại vật
        const cuteIcons = ['🌵', '🍄', '🐢', '🐌', '🌸', '🎁'];

        // Hàm nhảy
        function jump() {
            if (isJumping || isGameOver || isGameWon) return;
            isJumping = true;
            cat.classList.remove('running');
            cat.classList.add('jumping');

            // Hết thời gian nhảy thì trở lại chạy bình thường
            setTimeout(() => {
                cat.classList.remove('jumping');
                if (!isGameOver && !isGameWon) cat.classList.add('running');
                isJumping = false;
            }, 600); // 600ms khớp với animation jump trong CSS
        }

        // Bắt sự kiện nhấn phím Space hoặc Click chuột để nhảy
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') jump();
        });
        scene.addEventListener('mousedown', jump);

        // Tạo chướng ngại vật
        function spawnObstacle() {
            if (isGameOver || isGameWon) return;

            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.innerText = cuteIcons[Math.floor(Math.random() * cuteIcons.length)];
            
            // Gắn tốc độ (rút ngắn thời gian để nó chạy nhanh hơn)
            obstacle.style.animation = `moveObstacle ${gameSpeed}s linear`;
            scene.appendChild(obstacle);

            // Xóa chướng ngại vật khi đã ra khỏi màn hình để nhẹ trình duyệt
            setTimeout(() => {
                if (obstacle.parentNode && !isGameOver && !isGameWon) {
                    obstacle.remove();
                    update(); // Cộng điểm khi chướng ngại vật đi qua mà không đụng
                }
            }, gameSpeed * 1000);

            // Gọi đệ quy tạo chướng ngại vật tiếp theo ngẫu nhiên từ 1s đến 2.5s
            let randomTime = Math.random() * 1500 + 1000;
            obstacleInterval = setTimeout(spawnObstacle, randomTime);
        }

        // Cập nhật điểm và độ khó
        function updateScore() {
            if (isGameOver || isGameWon) return;
            score += 5;
            scoreElement.innerText = score;

            // Kiểm tra điều kiện thắng (Yêu cầu 4)
            if (score >= 305) {
                winGame();
                return;
            }

            // Tăng tốc độ mỗi 50 điểm (Yêu cầu 3)
            if (score % 50 === 0 && gameSpeed > 1.0) {
                gameSpeed -= 0.2; // Giảm thời gian trôi đi (tức là di chuyển nhanh hơn)
            }
        }

        // Vòng lặp kiểm tra va chạm
        function checkCollision() {
            const catRect = cat.getBoundingClientRect();
            const obstacles = document.querySelectorAll('.obstacle');

            obstacles.forEach(obs => {
                const obsRect = obs.getBoundingClientRect();

                // Thu nhỏ vùng va chạm lại một chút (hitbox nhỏ hơn hình thật) để game dễ chịu hơn
                const hitboxTolerence = 15; 

                if (
                    catRect.right - hitboxTolerence > obsRect.left &&
                    catRect.left + hitboxTolerence < obsRect.right &&
                    catRect.bottom - hitboxTolerence > obsRect.top &&
                    catRect.top + hitboxTolerence < obsRect.bottom
                ) {
                    loseGame();
                }
            });
        }

        // Kết thúc game (Thua)
        function loseGame() {
            isGameOver = true;
            cat.classList.remove('running', 'jumping');
            clearInterval(gameLoop);
            clearTimeout(obstacleInterval);
            
            // Dừng mọi chướng ngại vật trên màn hình
            const obstacles = document.querySelectorAll('.obstacle');
            obstacles.forEach(obs => {
                obs.style.animationPlayState = 'paused';
            });

            // Hiện màn hình Game Over (Yêu cầu 1)
            gameOverScreen.style.display = 'flex';
        }

        // Chiến thắng game
        function winGame() {
            isGameWon = true;
            cat.classList.remove('running', 'jumping');
            clearInterval(gameLoop);
            clearTimeout(obstacleInterval);
            
            // Xóa hết chướng ngại vật
            const obstacles = document.querySelectorAll('.obstacle');
            obstacles.forEach(obs => obs.remove());

            // Hiện màn hình Thắng và tạo pháo hoa
            victoryScreen.style.display = 'flex';
            createConfetti();
        }

        // Bắt đầu hoặc Chơi lại game
        function startGame() {
            isGameOver = false;
            isGameWon = false;
            score = 0;
            gameSpeed = 2.5; // Reset tốc độ
            scoreElement.innerText = score;
            
            gameOverScreen.style.display = 'none';
            victoryScreen.style.display = 'none';
            
            cat.classList.add('running');

            // Xóa chướng ngại vật cũ và pháo hoa nếu có
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            document.querySelectorAll('.confetti').forEach(c => c.remove());

            // Reset timers
            clearTimeout(obstacleInterval);
            clearInterval(gameLoop);

            // Bắt đầu lại
            spawnObstacle();
            gameLoop = setInterval(checkCollision, 10);
        }

        // Tạo hiệu ứng pháo hoa lúc thắng
        function createConfetti() {
            const colors = ['#C2185B', '#EC407A', '#F48FB1', '#FFF', '#FFD54F'];
            for(let i=0; i<50; i++) {
                let confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 800 + 'px';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = Math.random() * 2 + 's';
                scene.appendChild(confetti);
            }
        }

        // Khởi động game lần đầu
        startGame();

    </script>
</body>
</html>
