<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Run: Iu Mun Cute Pink Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Thiết lập nền chung */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #FCE4EC;
            font-family: 'Mali', cursive;
            user-select: none;
        }

        /* Khung cảnh chính */
        #scene {
            width: 800px;
            height: 350px;
            position: relative;
            overflow: hidden;
            background-color: #F8BBD0; 
            border-bottom: 8px solid #C2185B; 
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(194, 24, 91, 0.2);
            cursor: pointer;
        }

        /* Điểm số */
        #score-board {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 24px;
            color: #C2185B;
            font-weight: bold;
            z-index: 10;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 15px;
            border-radius: 20px;
            box-shadow: 2px 2px 0px #EC407A;
        }

        /* === 1. Hiệu ứng Mèo === */
        #cat {
            position: absolute;
            bottom: 5px;
            left: 50px;
            z-index: 2;
        }

        #cat img {
            width: 80px; 
            height: auto;
            display: block;
        }

        .running { animation: run 0.2s infinite alternate ease-in-out; }
        @keyframes run {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-12px) rotate(-3deg); }
        }

        .jumping { animation: jump 0.6s linear !important; }
        @keyframes jump {
            0% { bottom: 5px; }
            40% { bottom: 150px; } 
            50% { bottom: 150px; } 
            60% { bottom: 150px; }
            100% { bottom: 5px; }
        }

        /* === 2. Chướng ngại vật === */
        .obstacle {
            position: absolute;
            bottom: 5px;
            right: -80px; 
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .obstacle img { width: 50px; height: auto; }

        @keyframes moveObstacle {
            0% { right: -80px; }
            100% { right: 850px; }
        }

        /* === 3. Màn hình Overlay chung === */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(252, 228, 236, 0.9);
            display: none; flex-direction: column; justify-content: center;
            align-items: center; z-index: 20; text-align: center;
        }

        .overlay h2 { font-size: 40px; color: #C2185B; margin-bottom: 10px; text-shadow: 2px 2px 0px #FFF; }
        .overlay img { width: 150px; max-height: 150px; margin-bottom: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        
        .btn {
            padding: 10px 30px; font-size: 20px; font-family: 'Mali', cursive; font-weight: bold;
            color: white; background-color: #EC407A; border: none; border-radius: 25px;
            cursor: pointer; box-shadow: 0 5px 0px #C2185B; transition: all 0.1s;
        }
        .btn:active { transform: translateY(5px); box-shadow: 0 0px 0px #C2185B; }

        /* === 4. BẢNG THÔNG BÁO NHÚN NHẢY (VICTORY MODAL) === */
        .modal-content {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 25px;
            border: 5px dashed #F48FB1;
            box-shadow: 0 15px 35px rgba(194, 24, 91, 0.3);
            /* Mặc định ẩn để chờ animation */
            transform: scale(0);
        }

        /* Animation nảy lên như thạch (Jelly Bounce) */
        .bounce-in {
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(0.95); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* === 5. HIỆU ỨNG CƠN MƯA TRÁI TIM (HEART CONFETTI) === */
        .confetti-heart {
            position: absolute;
            z-index: 25; /* Đè lên cả bảng thông báo */
            pointer-events: none;
            user-select: none;
            animation: fall-and-sway linear infinite;
        }

        /* Hiệu ứng rơi lả tả và lắc lư nhẹ */
        @keyframes fall-and-sway {
            0% { top: -50px; transform: translateX(0) rotate(0deg); opacity: 1; }
            50% { transform: translateX(30px) rotate(180deg); }
            100% { top: 400px; transform: translateX(-30px) rotate(360deg); opacity: 0; }
        }

        /* === Mây và Chữ bay === */
        #flying-text {
            position: absolute; top: 50%; transform: translateY(-50%); left: 100%;
            font-size: 45px; font-weight: bold; color: #FFFFFF;
            text-shadow: 3px 3px 0px #EC407A, -2px -2px 5px rgba(255,255,255,0.5);
            white-space: nowrap; animation: fly 5s infinite linear; z-index: 3;
        }
        @keyframes fly { 0% { left: 110%; } 100% { left: -60%; } }
        
        .cloud { position: absolute; color: rgba(255, 255, 255, 0.7); animation: cloud-move infinite linear; z-index: 1; }
        .cloud1 { top: 40px; left: 100%; animation-duration: 12s; font-size: 40px; }
        .cloud2 { top: 100px; left: 100%; animation-duration: 9s; animation-delay: 3s; font-size: 30px; }
        .cloud3 { top: 20px; left: 100%; animation-duration: 15s; animation-delay: 1s; font-size: 25px; opacity: 0.6; }
        .cloud4 { top: 150px; left: 100%; animation-duration: 10s; animation-delay: 5s; font-size: 35px; }
        .cloud5 { top: 80px; left: 100%; animation-duration: 18s; animation-delay: 7s; font-size: 20px; opacity: 0.5; }
        @keyframes cloud-move { 0% { left: 100%; opacity: 0; } 10% { opacity: 0.8; } 90% { opacity: 0.8; } 100% { left: -20%; opacity: 0; } }

    </style>
</head>
<body>

    <div id="scene">
        <div id="score-board">Điểm: <span id="score">0</span></div>

        <div class="cloud cloud1">☁️</div>
        <div class="cloud cloud2">☁️</div>
        <div class="cloud cloud3">☁️</div>
        <div class="cloud cloud4">☁️</div>
        <div class="cloud cloud5">☁️</div>
        <div id="flying-text">Iu mun cute ❤️</div>
        
        <div id="cat" class="running">
            <img src="meo.png" alt="Cute Cat">
        </div>

        <div id="game-over" class="overlay">
            <h2>Ui da! Đụng trúng rồi!</h2>
            <img src="meo_fail.jpg" alt="Mèo khóc" onerror="this.src='https://via.placeholder.com/150/F8BBD0/C2185B?text=Meo+Khoc'">
            <button class="btn" onclick="startGame()">Chơi Lại Nè</button>
        </div>

        <div id="victory" class="overlay">
            <div class="modal-content" id="victory-modal">
                <h2>🎉 Yayyy! Mun Giỏi Quá! 🎉</h2>
                <p style="color: #C2185B; font-weight: bold; font-size: 20px;">Đã đạt 305 điểm yêu thương ❤️</p>
                <img src="meo_win.png" alt="Mèo vui vẻ" onerror="this.src='https://via.placeholder.com/150/F8BBD0/C2185B?text=Meo+Vui'">
                <br>
                <button class="btn" onclick="startGame()">Chơi Lại Từ Đầu</button>
            </div>
        </div>
    </div>

    <script>
        const scene = document.getElementById('scene');
        const cat = document.getElementById('cat');
        const scoreElement = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const victoryScreen = document.getElementById('victory');
        const victoryModal = document.getElementById('victory-modal'); // Bắt ID của bảng thông báo
        
        let isJumping = false;
        let isGameOver = false;
        let isGameWon = false;
        let score = 0;
        let gameSpeed = 2.5; 
        let obstacleInterval;
        let gameLoop;
        
        const obstacleAssets = [
            { src: 'meo_1.jpg', fallback: '🧶' },
            { src: 'meo_2.jpg', fallback: '🐁' },
            { src: 'meo_3.jpg', fallback: '🐟' },
            { src: 'meo_4.jpg', fallback: '🪴' },
            { src: 'meo_5.jpg', fallback: '🥛' }
        ];

        function jump() {
            if (isJumping || isGameOver || isGameWon) return;
            isJumping = true;
            cat.classList.remove('running');
            cat.classList.add('jumping');

            setTimeout(() => {
                cat.classList.remove('jumping');
                if (!isGameOver && !isGameWon) cat.classList.add('running');
                isJumping = false;
            }, 600); 
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') jump();
        });
        scene.addEventListener('mousedown', jump);

        function spawnObstacle() {
            if (isGameOver || isGameWon) return;

            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            
            const randomAsset = obstacleAssets[Math.floor(Math.random() * obstacleAssets.length)];
            
            const img = document.createElement('img');
            img.src = randomAsset.src;
            
            img.onerror = () => {
                obstacle.innerText = randomAsset.fallback;
                obstacle.style.fontSize = '40px'; 
                img.remove(); 
            };

            obstacle.appendChild(img);
            obstacle.style.animation = `moveObstacle ${gameSpeed}s linear`;
            scene.appendChild(obstacle);

            obstacle.addEventListener('animationend', () => {
                if (!isGameOver && !isGameWon) {
                    obstacle.remove();
                    updateScore(); 
                }
            });

            let randomTime = Math.random() * 1500 + 1000;
            obstacleInterval = setTimeout(spawnObstacle, randomTime);
        }

        function updateScore() {
            if (isGameOver || isGameWon) return;
            score += 10; 
            scoreElement.innerText = score;

            if (score >= 305) {
                winGame();
                return;
            }

            if (score % 50 === 0 && gameSpeed > 1.0) {
                gameSpeed -= 0.2; 
            }
        }

        function checkCollision() {
            const catRect = cat.getBoundingClientRect();
            const obstacles = document.querySelectorAll('.obstacle');

            obstacles.forEach(obs => {
                const obsRect = obs.getBoundingClientRect();
                const hitboxTolerence = 15; 

                if (
                    catRect.right - hitboxTolerence > obsRect.left &&
                    catRect.left + hitboxTolerence < obsRect.right &&
                    catRect.bottom - hitboxTolerence > obsRect.top &&
                    catRect.top + hitboxTolerence < obsRect.bottom
                ) {
                    loseGame();
                }
            });
        }

        function loseGame() {
            isGameOver = true;
            cat.classList.remove('running', 'jumping');
            clearInterval(gameLoop);
            clearTimeout(obstacleInterval);
            
            document.querySelectorAll('.obstacle').forEach(obs => {
                obs.style.animationPlayState = 'paused';
            });

            gameOverScreen.style.display = 'flex';
        }

        function winGame() {
            isGameWon = true;
            cat.classList.remove('running', 'jumping');
            clearInterval(gameLoop);
            clearTimeout(obstacleInterval);
            
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            
            // Hiện overlay và gắn class để kích hoạt hiệu ứng nảy (Jelly Bounce)
            victoryScreen.style.display = 'flex';
            victoryModal.classList.add('bounce-in');
            
            createConfetti();
        }

        function startGame() {
            isGameOver = false;
            isGameWon = false;
            score = 0;
            gameSpeed = 2.5; 
            scoreElement.innerText = score;
            
            gameOverScreen.style.display = 'none';
            victoryScreen.style.display = 'none';
            
            // Xóa class nảy khi chơi lại để lần sau thắng vẫn nảy tiếp
            victoryModal.classList.remove('bounce-in');
            
            cat.classList.add('running');

            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            
            // Đã đổi class thành confetti-heart
            document.querySelectorAll('.confetti-heart').forEach(c => c.remove());

            clearTimeout(obstacleInterval);
            clearInterval(gameLoop);

            spawnObstacle();
            gameLoop = setInterval(checkCollision, 10);
        }

        // --- Cập nhật hàm tạo Cơn mưa trái tim ---
        function createConfetti() {
            // Sử dụng các icon dễ thương thay cho khối vuông
            const cuteIcons = ['💖', '🌸', '✨', '🎀', '💗'];
            
            for(let i=0; i < 40; i++) {
                let confetti = document.createElement('div');
                confetti.classList.add('confetti-heart');
                
                // Chọn icon ngẫu nhiên
                confetti.innerText = cuteIcons[Math.floor(Math.random() * cuteIcons.length)];
                
                // Trải đều theo chiều ngang của cảnh game (800px)
                confetti.style.left = Math.random() * 800 + 'px';
                
                // Kích thước to nhỏ khác nhau
                confetti.style.fontSize = (Math.random() * 15 + 15) + 'px';
                
                // Thời gian rơi và độ trễ ngẫu nhiên
                confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                confetti.style.animationDelay = (Math.random() * 1.5) + 's';
                
                scene.appendChild(confetti);
            }
        }

        startGame();
    </script>
</body>
</html>
