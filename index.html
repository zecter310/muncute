<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Random Color Matrix</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace}
#binaryRain{position:fixed;inset:0;width:100vw;height:100vh;background:#000;z-index:0}
.screen-fx{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at center,rgba(0,255,110,.08),transparent 30%),radial-gradient(circle at center,transparent 42%,rgba(0,0,0,.78) 100%)}
main{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:18px}
.matrix-card{width:min(84vmin,880px);aspect-ratio:1/1;padding:clamp(12px,2vmin,22px);border-radius:24px;border:1px solid rgba(0,255,110,.34);background:linear-gradient(180deg,rgba(0,30,8,.22),rgba(0,0,0,.9)),rgba(0,0,0,.8);box-shadow:0 0 24px rgba(0,255,110,.16),0 0 54px rgba(0,255,110,.08),inset 0 0 24px rgba(0,255,110,.09);backdrop-filter:blur(5px);overflow:hidden}
#rgbMatrix{width:100%;height:100%;display:block;border-radius:16px;background:rgba(0,0,0,.94);box-shadow:inset 0 0 32px rgba(0,255,110,.12),inset 0 0 130px rgba(0,0,0,.62);cursor:pointer}
.hint{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:3;color:rgba(146,255,186,.72);font-size:12px;letter-spacing:.08em;text-shadow:0 0 10px rgba(0,255,110,.45);text-align:center;user-select:none}
</style>
</head>
<body>
<canvas id="binaryRain" aria-hidden="true"></canvas>
<div class="screen-fx" aria-hidden="true"></div>
<main><section class="matrix-card" aria-label="Ma trận màu random thành ảnh gốc"><canvas id="rgbMatrix" title="Bấm để chạy lại hiệu ứng"></canvas></section></main>
<div class="hint">RANDOM MÀU → ẢNH GỐC · CLICK ĐỂ CHẠY LẠI</div>
<script>
// Dán link ảnh GitHub của bạn vào đây.
// Có thể dùng link raw.githubusercontent.com hoặc link github.com/.../blob/...
const GITHUB_IMAGE_URL="https://github.com/zecter310/muncute/blob/94e1e348e84440a0b9d658454426ba9e9de23585/mun.jpg";
const SOURCE_IMAGE=normalizeGithubImageUrl(GITHUB_IMAGE_URL);
const rainCanvas=document.getElementById("binaryRain"),rainCtx=rainCanvas.getContext("2d");
const matrixCanvas=document.getElementById("rgbMatrix"),matrixCtx=matrixCanvas.getContext("2d");
const MATRIX_SIZE=64,GREEN="0,255,100",RANDOM_ONLY_DURATION=2400,RESOLVE_DURATION=5200;
let dpr=Math.max(1,Math.min(window.devicePixelRatio||1,2)),rainFontSize=16,rainColumns=[],rainLastTime=0,cells=[],sourceReady=false,animationStart=performance.now()+450,matrixLastFrame=0;
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function hash01(x,y,seed=0){const v=Math.sin(x*127.1+y*311.7+seed*79.3)*43758.5453123;return v-Math.floor(v)}
function randomChannel(){return Math.floor(Math.random()*256)}
function randomRgb(){return [randomChannel(),randomChannel(),randomChannel()]}
function mix(a,b,t){return Math.round(a+(b-a)*t)}
function resizeRain(){
 dpr=Math.max(1,Math.min(window.devicePixelRatio||1,2));
 rainCanvas.width=Math.floor(window.innerWidth*dpr); rainCanvas.height=Math.floor(window.innerHeight*dpr);
 rainCanvas.style.width=window.innerWidth+"px"; rainCanvas.style.height=window.innerHeight+"px";
 rainCtx.setTransform(dpr,0,0,dpr,0,0);
 rainFontSize=Math.max(15,Math.floor(window.innerWidth/92));
 const count=Math.ceil(window.innerWidth/rainFontSize)+1;
 rainColumns=Array.from({length:count},(_,i)=>createRainColumn(i));
}
function createRainColumn(i){
 const changeInterval=220+Math.random()*320;
 return {x:i*rainFontSize,y:-Math.random()*window.innerHeight,speed:.096+Math.random()*.336,length:8+Math.floor(Math.random()*15),bits:Array.from({length:28},()=>Math.random()>.5?"1":"0"),changeInterval,nextChangeAt:performance.now()+Math.random()*changeInterval,phase:Math.random()*1000};
}
function drawBinaryRain(now){
 const delta=Math.min(40,now-rainLastTime||16); rainLastTime=now;
 rainCtx.fillStyle="rgba(0,0,0,.06)"; rainCtx.fillRect(0,0,window.innerWidth,window.innerHeight);
 rainCtx.font=rainFontSize+'px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace';
 rainCtx.textAlign="center"; rainCtx.textBaseline="top";
 for(const col of rainColumns){
  if(now>=col.nextChangeAt){
   const flips=1+Math.floor(Math.random()*2);
   for(let i=0;i<flips;i++){const idx=Math.floor(Math.random()*col.bits.length); col.bits[idx]=col.bits[idx]==="0"?"1":"0";}
   col.nextChangeAt=now+col.changeInterval*(.9+Math.random()*.35);
  }
  for(let i=0;i<col.length;i++){
   const y=col.y-i*rainFontSize;
   if(y<-rainFontSize||y>window.innerHeight+rainFontSize)continue;
   const bit=col.bits[(i+Math.floor(now*.0009+col.phase))%col.bits.length];
   const head=i===0,tail=1-i/col.length,alpha=.03+tail*(head?.42:.18);
   rainCtx.shadowColor=`rgba(${GREEN},${head?.16:.06})`; rainCtx.shadowBlur=head?4:1;
   rainCtx.fillStyle=`rgba(${GREEN},${alpha})`; rainCtx.fillText(bit,col.x,y);
  }
  col.y+=col.speed*(delta/16);
  if(col.y-col.length*rainFontSize>window.innerHeight+40){const reset=createRainColumn(Math.round(col.x/rainFontSize)); reset.x=col.x; reset.y=-Math.random()*180; Object.assign(col,reset);}
 }
 rainCtx.shadowBlur=0;
}
function resizeMatrixCanvas(){
 const rect=matrixCanvas.getBoundingClientRect();
 const size=Math.max(340,Math.floor(rect.width*dpr));
 matrixCanvas.width=size; matrixCanvas.height=size; matrixCtx.setTransform(1,0,0,1,0,0);
}
function normalizeGithubImageUrl(url){
 try{
  const parsed=new URL(url);
  if(parsed.hostname==="github.com"){
   const parts=parsed.pathname.split("/").filter(Boolean);
   const blobIndex=parts.indexOf("blob");
   if(parts.length>=5&&blobIndex===2){
    const user=parts[0],repo=parts[1],branch=parts[3],filePath=parts.slice(4).join("/");
    return `https://raw.githubusercontent.com/${user}/${repo}/${branch}/${filePath}`;
   }
  }
 }catch(error){
  console.warn("GitHub image URL không hợp lệ, dùng nguyên URL ban đầu.");
 }
 return url;
}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image(); img.crossOrigin="anonymous"; img.referrerPolicy="no-referrer"; img.onload=()=>resolve(img); img.onerror=reject; img.src=src;})}
function buildTargetColorCells(img){
 const off=document.createElement("canvas"); off.width=MATRIX_SIZE; off.height=MATRIX_SIZE;
 const ctx=off.getContext("2d",{willReadFrequently:true});
 ctx.fillStyle="rgb(0,0,0)"; ctx.fillRect(0,0,MATRIX_SIZE,MATRIX_SIZE);
 const scale=Math.max(MATRIX_SIZE/img.width,MATRIX_SIZE/img.height);
 const dw=img.width*scale, dh=img.height*scale, ox=(MATRIX_SIZE-dw)/2, oy=(MATRIX_SIZE-dh)/2;
 ctx.drawImage(img,ox,oy,dw,dh);
 const pixels=ctx.getImageData(0,0,MATRIX_SIZE,MATRIX_SIZE).data, center=(MATRIX_SIZE-1)/2;
 cells=[];
 for(let y=0;y<MATRIX_SIZE;y++) for(let x=0;x<MATRIX_SIZE;x++){
  const index=y*MATRIX_SIZE+x, p=index*4, target=[pixels[p],pixels[p+1],pixels[p+2]];
  const dx=(x-center)/center, dy=(y-center)/center, distance=Math.sqrt(dx*dx+dy*dy);
  cells.push({target,current:randomRgb(),next:randomRgb(),lastRandomAt:0,randomInterval:100+Math.random()*220,resolveDelay:distance*.52+hash01(x,y,31)*.48,settleMs:380+hash01(x,y,44)*460});
 }
 sourceReady=true;
}
function restartAnimation(){
 animationStart=performance.now()+250;
 const center=(MATRIX_SIZE-1)/2;
 for(let i=0;i<cells.length;i++){
  const x=i%MATRIX_SIZE, y=Math.floor(i/MATRIX_SIZE), dx=(x-center)/center, dy=(y-center)/center, distance=Math.sqrt(dx*dx+dy*dy);
  cells[i].current=randomRgb(); cells[i].next=randomRgb(); cells[i].lastRandomAt=0; cells[i].resolveDelay=distance*.52+hash01(x,y,Math.random()*100)*.48;
 }
}
function getDisplayedRgb(cell,elapsed,now){
 const resolveStart=RANDOM_ONLY_DURATION+cell.resolveDelay*RESOLVE_DURATION, resolveEnd=resolveStart+cell.settleMs;
 if(elapsed<resolveStart){
  if(now-cell.lastRandomAt>cell.randomInterval){cell.current=cell.next; cell.next=randomRgb(); cell.lastRandomAt=now;}
  return cell.current;
 }
 if(elapsed<resolveEnd){
  const t=clamp((elapsed-resolveStart)/cell.settleMs,0,1), e=t*t*(3-2*t);
  return [mix(cell.current[0],cell.target[0],e),mix(cell.current[1],cell.target[1],e),mix(cell.current[2],cell.target[2],e)];
 }
 return cell.target;
}
function drawMatrix(now){
 if(!sourceReady)return;
 if(now-matrixLastFrame<40)return; matrixLastFrame=now;
 const width=matrixCanvas.width, height=matrixCanvas.height, cell=width/MATRIX_SIZE, elapsed=now-animationStart;
 matrixCtx.clearRect(0,0,width,height); matrixCtx.fillStyle="rgba(0,0,0,.97)"; matrixCtx.fillRect(0,0,width,height);
 const gap=Math.max(.8,cell*.06), inner=Math.max(1,cell-gap*2), radius=Math.min(inner*.24,4*dpr);
 for(let y=0;y<MATRIX_SIZE;y++) for(let x=0;x<MATRIX_SIZE;x++){
  const rgb=getDisplayedRgb(cells[y*MATRIX_SIZE+x],elapsed,now), [r,g,b]=rgb;
  const px=x*cell+gap, py=y*cell+gap;
  matrixCtx.shadowColor=`rgba(${r},${g},${b},0.30)`;
  matrixCtx.shadowBlur=cell*.25;
  matrixCtx.fillStyle=`rgb(${r},${g},${b})`;
  matrixCtx.beginPath();
  matrixCtx.roundRect(px,py,inner,inner,radius);
  matrixCtx.fill();
 }
 matrixCtx.shadowBlur=0;
 matrixCtx.strokeStyle='rgba(255,255,255,0.035)'; matrixCtx.lineWidth=Math.max(.5,cell*.025);
 for(let y=0;y<MATRIX_SIZE;y+=4){matrixCtx.beginPath(); matrixCtx.moveTo(0,y*cell+.5); matrixCtx.lineTo(width,y*cell+.5); matrixCtx.stroke();}
}
function animate(now){drawBinaryRain(now); drawMatrix(now); requestAnimationFrame(animate)}
function resizeAll(){resizeRain(); resizeMatrixCanvas()}
window.addEventListener("resize",resizeAll); matrixCanvas.addEventListener("click",restartAnimation); resizeAll();
loadImage(SOURCE_IMAGE).then(img=>{buildTargetColorCells(img); requestAnimationFrame(animate)}).catch(err=>console.error("Không thể tải ảnh nguồn.",err));
</script>
</body>
</html>
